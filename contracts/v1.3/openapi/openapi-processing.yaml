  /api/v1/internal/history-exports:
    post:
      operationId: internalCreateHistoryExport
      summary: Durably enqueue an authorized frozen history export
      description: 'M6-HISTORY-01/1.0.0; design only, no M6 runtime rollout. Read API uses SELECT-only
        source pool plus a separate metadata writer pool for snapshots/jobs. Original outcomes stay in
        PostgreSQL; no processed archive or source cleanup in M6. UTC microseconds; every page/job/download
        rechecks current actor and machine scope. Require both service identity and verified Business
        delegation; intersect delegated machines with service scope and bind snapshot/job to actor. Idempotency
        binds actor, canonical query/format/delivery and effective frozen snapshot/scope; same key with
        different intent409. AUTO CSV may stream only after complete preflight<=10000 rows/10 MiB/10s,
        otherwise durable job202 before headers. PARQUET/JOB always202 after commit. Read API runner concurrency1/replica,
        leases/fencing/recovery; no Worker loop. No object store: small PROCESSING CSV may work, artifact
        jobs unavailable. Same streaming key reuses frozen snapshot; expired input returns410, not a new
        query.'
      x-maintai-roles:
      - BUSINESS_SERVICE
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: X-MaintAI-History-Profile
        in: header
        required: true
        schema:
          type: string
          const: M6-HISTORY-01/1.0.0
        description: Explicit opt-in; absent/other profile is rejected, never reinterpret a baseline cursor.
