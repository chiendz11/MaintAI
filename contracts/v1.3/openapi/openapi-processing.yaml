        rechecks current actor and machine scope. Require both service identity and verified Business
        delegation; intersect delegated machines with service scope and bind snapshot/job to actor. Check
        owner/current scope/status/TTL and exact artifact reference before303 signed URL (<=5m), or200
        authenticated proxy. Never forward Authorization/delegation to object storage. Download target
        must be browser-reachable; no internal-only MinIO DNS. Artifact TTL24h; before success409, expired410.
      x-maintai-roles:
      - BUSINESS_SERVICE
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: X-MaintAI-History-Profile
        in: header
