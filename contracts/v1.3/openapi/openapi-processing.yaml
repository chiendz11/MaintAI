openapi: 3.1.1
info:
  title: MaintAI Processing Read API
  version: 2.0.0
  description: Description revision2.0.0 freezes M6-HISTORY-01/1.0.0 history/export interfaces. Existing
    M1-M5 runtime DTOs and Kafka bundle remain unchanged; M6 routes are specification only.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://processing.example.invalid
  description: Illustrative only; configure environment routing.
security:
- BearerAuth: []
x-maintai-audience: processing-internal
paths:
  /api/v1/internal/machines/{machine_id}/predictions:
    get:
      operationId: internalListProcessingHistory
      summary: List immutable outcomes across hot/archive tiers
      description: M6-HISTORY-01/1.0.0; design only, no M6 runtime rollout. Read API uses SELECT-only
        source pool plus a separate metadata writer pool for snapshots/jobs. Original outcomes stay in
        PostgreSQL; no processed archive or source cleanup in M6. UTC microseconds; every page/job/download
        rechecks current actor and machine scope. Require both service identity and verified Business
        delegation; intersect delegated machines with service scope and bind snapshot/job to actor. Filter
        from inclusive/to exclusive by processing_results.completed_at, exposed as processed_at. Order
        processed_at DESC,result_id DESC. First page materializes committed bounded membership; late commits
        require a new snapshot. Default last1h, range<=31d, snapshot10m/100000 IDs; subsequent cursor
        requests reuse frozen omitted time bounds. No OFFSET or archive fallback.
      x-maintai-roles:
      - BUSINESS_SERVICE
      parameters:
      - name: machine_id
        in: path
        required: true
        schema: &id002
          type: string
          minLength: 1
      - name: from
        in: query
        required: false
        schema: &id001
          type: string
          format: date-time
        description: Inclusive Clock selected by metric collection.
      - name: to
        in: query
        required: false
        schema: *id001
        description: Exclusive Clock selected by metric collection.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        required: false
        schema: *id002
        description: Opaque authenticated M6 token binding profile, collection, frozen query, actor/scope,
          snapshot, sort/last key, key version and expiry; legacy tokens rejected.
      - name: model_version
        in: query
        required: false
        schema: *id002
      - name: result_kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - PREDICTION_COMPLETED
          - DATA_INVALID
          - INFERENCE_UNAVAILABLE
      - name: X-MaintAI-History-Profile
        in: header
        required: true
        schema:
          type: string
          const: M6-HISTORY-01/1.0.0
        description: Explicit opt-in; absent/other profile is rejected, never reinterpret a baseline cursor.
      responses:
        '400':
          description: Invalid request/cursor.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '401':
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '403':
          description: Insufficient permission or machine scope.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '404':
          description: Resource not found/not materialized.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '409':
          description: Idempotency, state or version conflict.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '410':
          description: History/snapshot/artifact expired.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '422':
          description: Invalid query/payload or query budget exceeded.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '429':
          description: Admission limit exceeded.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '503':
          description: Required dependency/coverage unavailable.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '504':
          description: Dependency timed out.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '200':
          description: Persisted result.
          content:
            application/json:
              schema:
                $ref: ../schemas/history-m6.schema.json#/$defs/HistoryPage
              examples:
                m6:
                  externalValue: ../examples/m6/processing-page.json
      security:
      - BearerAuth: []
        HistoryDelegation: []
      x-maintai-history-profile: M6-HISTORY-01/1.0.0
