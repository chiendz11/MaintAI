  /api/v1/internal/machines/{machine_id}/timeseries:
    get:
      operationId: internalGetMachineTimeSeries
      summary: Read bounded min/max/avg/count chart buckets
      description: M6-HISTORY-01/1.0.0; design only, no M6 runtime rollout. Read API uses SELECT-only
        source pool plus a separate metadata writer pool for snapshots/jobs. Original outcomes stay in
        PostgreSQL; no processed archive or source cleanup in M6. UTC microseconds; every page/job/download
        rechecks current actor and machine scope. Require both service identity and verified Business
        delegation; intersect delegated machines with service scope and bind snapshot/job to actor. Numeric
        sensor metrics use RAW/received_at; probability/risk use PROCESSING/processed_at. Bounded UTC
        buckets [start,end), gaps null, no interpolation; probability only completed valid. Alert markers
        are merged only by Business, never cross-owner SQL. Marker cursor is actor/query/snapshot-bound
        and independent of bucket budget; marker lacking exact axis clock has null position_at and remains
        in a separate list. Markers use snapshot as_of; new alerts appear on refresh. No metadata write
        via source pool.
      x-maintai-roles:
      - BUSINESS_SERVICE
      parameters:
      - name: machine_id
        in: path
        required: true
        schema: &id006
          type: string
          minLength: 1
      - name: from
        in: query
        required: false
        schema: &id005
          type: string
          format: date-time
        description: Inclusive Clock selected by metric collection.
      - name: to
        in: query
        required: false
        schema: *id005
        description: Exclusive Clock selected by metric collection.
      - name: metric
        in: query
        required: true
        schema:
          type: string
          enum:
          - air_temperature_k
          - process_temperature_k
          - rotational_speed_rpm
          - torque_nm
          - tool_wear_min
          - failure_probability
          - risk_score
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - auto
          - 1s
          - 10s
          - 1m
          - 5m
          - 1h
          - 1d
      - name: max_points
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 1000
      - name: markers_cursor
        in: query
        required: false
        schema: *id006
      - name: X-MaintAI-History-Profile
        in: header
        required: true
        schema:
