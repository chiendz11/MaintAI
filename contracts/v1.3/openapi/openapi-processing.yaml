        in: query
        required: true
        schema:
          type: string
          enum:
          - air_temperature_k
          - process_temperature_k
          - rotational_speed_rpm
          - torque_nm
          - tool_wear_min
          - failure_probability
          - risk_score
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - auto
          - 1s
          - 10s
          - 1m
          - 5m
          - 1h
          - 1d
      - name: max_points
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 1000
      - name: markers_cursor
        in: query
        required: false
        schema: *id002
