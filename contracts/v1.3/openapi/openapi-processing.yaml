        '403':
          description: Insufficient permission or machine scope.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '404':
          description: Resource not found/not materialized.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '409':
          description: Idempotency, state or version conflict.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '410':
          description: History/snapshot/artifact expired.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '422':
          description: Invalid query/payload or query budget exceeded.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '429':
          description: Admission limit exceeded.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '503':
          description: Required dependency/coverage unavailable.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '504':
          description: Dependency timed out.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '202':
          description: Persisted result.
          content:
            application/json:
              schema:
                $ref: ../schemas/history-m6.schema.json#/$defs/ExportJob
        '200':
          description: Preflight-complete small CSV stream; failure after headers aborts stream and is
            not reported as a successful file. UTF-8 CSV quoting and spreadsheet-text sanitization required.
            No DB transaction held for a slow client.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename generated by server, no untrusted header text.
            X-MaintAI-History-Snapshot:
              schema:
                type: string
                minLength: 1
          content:
            text/csv:
              schema:
                type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/history-m6.schema.json#/$defs/ExportRequest
      security:
      - BearerAuth: []
        HistoryDelegation: []
      x-maintai-history-profile: M6-HISTORY-01/1.0.0
