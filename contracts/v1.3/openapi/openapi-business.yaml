openapi: 3.1.1
info:
  title: MaintAI Business REST/SSE API
  version: 1.3.2
  description: Target business API; normative amendment1.3.2. Legacy unchanged business DTOs are explicitly reused.
    Auth required, main UI only. No ingestion or simulator control routes.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://business.example.invalid
  description: Illustrative only; configure environment routing.
externalDocs:
  description: Design target v1.4; this OpenAPI remains the 1.3.2 baseline pending migration.
  url: https://github.com/chiendz11/MaintAI/blob/main/docs/MaintAI_System_Contracts_v1_4_DEPLOYMENT_PROVENANCE.md
x-maintai-decisions: ../../../docs/api-contract-decisions.md
tags:
- name: Sensor
  description: Simulator ingestion and idempotency
- name: Machines
  description: Fleet, current machine state and historical readings
- name: Alerts
  description: Alert reads and lifecycle
- name: Feedback
  description: Technician feedback without automatic retraining
- name: Copilot
  description: Backend facade for cached/generated RAG briefs
- name: Monitoring
  description: Service status and persisted batch reports
- name: Realtime
  description: Optional SSE invalidation notifications
- name: Operations
  description: Platform health and metrics
security:
- BearerAuth: []
paths:
  /api/v1/machines:
    get:
      operationId: listMachines
      tags:
      - Machines
      summary: List fleet state
      description: Order machine_id ASC. Empty filtered results return 200 with items=[] and total=0. INVALID/UNKNOWN
        are explicit states with no current risk score; do not render them as NORMAL. Authentication is required
        on shared deployment. For all shared deployment requests, enforce the listed roles; 401/403 are explicit
        failures. See completion decision AUTH-01. Amendment1.3.2 requires authentication and machine-scope checks;
        any legacy optional-auth wording is superseded.
      x-maintai-source: baseline 15.1; completion PAGE-01, STATE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: limit
        in: query
        required: false
        description: Maximum items returned.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Offset into the filtered, ordered collection. total is the count before pagination.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: state
        in: query
        required: false
        description: Optional operational-state filter.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/MachineState
      responses:
        '200':
          description: Fleet page.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineList'
              examples:
                machines:
                  externalValue: ../examples/http/backend/machines.json
                machines_empty:
                  externalValue: ../examples/http/backend/machines-empty.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
  /api/v1/machines/{machine_id}:
    get:
      operationId: getMachine
      tags:
      - Machines
      summary: Get current machine detail
      description: latest_prediction describes the current event only; it is null for INVALID/UNKNOWN. Historical
        predictions remain available through historical records; do not silently reuse an old prediction as the
        current result. Authentication is required on shared deployment. For all shared deployment requests, enforce
        the listed roles; 401/403 are explicit failures. See completion decision AUTH-01. Amendment1.3.2 requires
        authentication and machine-scope checks; any legacy optional-auth wording is superseded.
      x-maintai-source: baseline 15.2; completion STATE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: machine_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Current state with nullable absent data.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineDetail'
              examples:
                machine_detail:
                  externalValue: ../examples/http/backend/machine-detail.json
                machine_unknown:
                  externalValue: ../examples/http/backend/machine-unknown.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/MACHINE_NOT_FOUND'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
  /api/v1/machines/{machine_id}/sensor-readings:
    get:
      operationId: listRawHistory
      summary: Read accepted raw history with explicit coverage
      description: 'Normative semantics: System Contracts §34, HISTORY-01 and RECOVERY-01. Specification only; runtime
        not implemented. Amendment1.3.2 requires authentication and machine-scope checks; any legacy optional-auth
        wording is superseded.'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      parameters:
      - &id004
        name: machine_id
        in: path
        required: true
        schema: &id002
          type: string
          minLength: 1
      - &id005
        name: from
        in: query
        required: false
        schema: &id001
          type: string
          format: date-time
      - &id006
        name: to
        in: query
        required: false
        schema: *id001
      - &id007
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - &id008
        name: cursor
        in: query
        required: false
        schema: *id002
      responses:
        '400':
          description: Invalid request/cursor.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '401':
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '403':
          description: Insufficient permission or machine scope.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '404':
          description: Resource not found/not materialized.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '409':
          description: Idempotency, state or version conflict.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '410':
          description: History/snapshot/artifact expired.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '422':
          description: Invalid query/payload or query budget exceeded.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '429':
          description: Admission limit exceeded.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '503':
          description: Required dependency/coverage unavailable.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '504':
          description: Dependency timed out.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '200':
          description: Persisted result.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/RawHistoryPage
      security:
      - BearerAuth: []
  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags:
      - Alerts
      summary: List alerts
      description: Order created_at DESC, alert_id DESC; total counts matching rows before limit/offset. An unknown
        filter machine_id produces an empty result rather than claiming the machine resource exists. Authentication
        is required on shared deployment. For all shared deployment requests, enforce the listed roles; 401/403
        are explicit failures. See completion decision AUTH-01. Amendment1.3.2 requires authentication and machine-scope
        checks; any legacy optional-auth wording is superseded.
      x-maintai-source: baseline 15.4; completion PAGE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: limit
        in: query
        required: false
        description: Maximum items returned.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Offset into the filtered, ordered collection. total is the count before pagination.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: status
        in: query
        required: false
        description: Optional lifecycle status.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/AlertStatus
      - name: severity
        in: query
        required: false
        description: Optional severity.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/AlertSeverity
      - name: machine_id
        in: query
        required: false
        description: Optional machine filter.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Alert page.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
              examples:
                alerts:
                  externalValue: ../examples/http/backend/alerts.json
                alerts_empty:
                  externalValue: ../examples/http/backend/alerts-empty.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
  /api/v1/alerts/{alert_id}:
    get:
      operationId: getAlert
      tags:
      - Alerts
      summary: Get alert detail
      description: Alert severity and lifecycle remain independent of copilot availability. Return current CopilotSummary
        and history ordered timestamp ASC, alert_event_id ASC. Fetch full brief via the backend /brief endpoint;
        frontend never calls RAG directly. Authentication is required on shared deployment. For all shared deployment
        requests, enforce the listed roles; 401/403 are explicit failures. See completion decision AUTH-01. Amendment1.3.2
        requires authentication and machine-scope checks; any legacy optional-auth wording is superseded.
      x-maintai-source: baseline 15.5; completion BRIEF-01, AUDIT-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Alert, source context, prediction, copilot status and audit history.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
              examples:
                alert_detail:
                  externalValue: ../examples/http/backend/alert-detail.json
                alert_rag_unavailable:
                  externalValue: ../examples/http/backend/alert-rag-unavailable.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
  /api/v1/alerts/{alert_id}/ack:
    post:
      operationId: alertAck
      tags:
      - Alerts
      summary: Ack alert
      description: 'Allowed source statuses: OPEN; target: ACKNOWLEDGED. Atomically validate transition, update
        status and append audit history. Every other transition, including repeating a completed action, returns
        409. With auth enabled actor_id must match the authenticated principal (otherwise 403); actor_id alone grants
        no authority. Authentication is required on shared deployment. For all shared deployment requests, enforce
        the listed roles; 401/403 are explicit failures. See completion decision AUTH-01. Amendment1.3.2 requires
        authentication and machine-scope checks; any legacy optional-auth wording is superseded.'
      x-maintai-source: baseline 10.3/11; completion ACTION-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Transition committed; refresh alert detail after success.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AlertTransitionResult'
                - properties:
                    previous_status:
                      enum:
                      - OPEN
                    status:
                      const: ACKNOWLEDGED
              examples:
                ack_response:
                  externalValue: ../examples/http/backend/ack-response.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
        '409':
          $ref: '#/components/responses/INVALID_ALERT_TRANSITION'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorNote'
            examples:
              ack_request:
                externalValue: ../examples/http/backend/ack-request.json
      x-maintai-roles:
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
      x-maintai-transitions:
        from:
        - OPEN
        to: ACKNOWLEDGED
  /api/v1/alerts/{alert_id}/start:
    post:
      operationId: alertStart
      tags:
      - Alerts
      summary: Start alert
      description: 'Allowed source statuses: ACKNOWLEDGED, ESCALATED; target: IN_PROGRESS. Atomically validate transition,
        update status and append audit history. Every other transition, including repeating a completed action,
        returns 409. With auth enabled actor_id must match the authenticated principal (otherwise 403); actor_id
        alone grants no authority. Authentication is required on shared deployment. For all shared deployment requests,
        enforce the listed roles; 401/403 are explicit failures. See completion decision AUTH-01. Amendment1.3.2
        requires authentication and machine-scope checks; any legacy optional-auth wording is superseded.'
      x-maintai-source: baseline 10.3/11; completion ACTION-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Transition committed; refresh alert detail after success.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AlertTransitionResult'
                - properties:
                    previous_status:
                      enum:
                      - ACKNOWLEDGED
                      - ESCALATED
                    status:
                      const: IN_PROGRESS
              examples:
                start_response:
                  externalValue: ../examples/http/backend/start-response.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
        '409':
          $ref: '#/components/responses/INVALID_ALERT_TRANSITION'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorNote'
            examples:
              start_request:
                externalValue: ../examples/http/backend/start-request.json
      x-maintai-roles:
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
      x-maintai-transitions:
        from:
        - ACKNOWLEDGED
        - ESCALATED
        to: IN_PROGRESS
  /api/v1/alerts/{alert_id}/escalate:
    post:
      operationId: alertEscalate
      tags:
      - Alerts
      summary: Escalate alert
      description: 'Allowed source statuses: OPEN, ACKNOWLEDGED, IN_PROGRESS; target: ESCALATED. Atomically validate
        transition, update status and append audit history. Every other transition, including repeating a completed
        action, returns 409. With auth enabled actor_id must match the authenticated principal (otherwise 403);
        actor_id alone grants no authority. Authentication is required on shared deployment. For all shared deployment
        requests, enforce the listed roles; 401/403 are explicit failures. See completion decision AUTH-01. Amendment1.3.2
        requires authentication and machine-scope checks; any legacy optional-auth wording is superseded.'
      x-maintai-source: baseline 10.3/11; completion ACTION-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Transition committed; refresh alert detail after success.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AlertTransitionResult'
                - properties:
                    previous_status:
                      enum:
                      - OPEN
                      - ACKNOWLEDGED
                      - IN_PROGRESS
                    status:
                      const: ESCALATED
              examples:
                escalate_response:
                  externalValue: ../examples/http/backend/escalate-response.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
        '409':
          $ref: '#/components/responses/INVALID_ALERT_TRANSITION'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorNote'
            examples:
              escalate_request:
                externalValue: ../examples/http/backend/escalate-request.json
      x-maintai-roles:
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
      x-maintai-transitions:
        from:
        - OPEN
        - ACKNOWLEDGED
        - IN_PROGRESS
        to: ESCALATED
  /api/v1/alerts/{alert_id}/resolve:
    post:
      operationId: alertResolve
      tags:
      - Alerts
      summary: Resolve alert
      description: 'Allowed source statuses: ACKNOWLEDGED, IN_PROGRESS, ESCALATED; target: RESOLVED. Atomically
        validate transition, update status and append audit history. Every other transition, including repeating
        a completed action, returns 409. With auth enabled actor_id must match the authenticated principal (otherwise
        403); actor_id alone grants no authority. Authentication is required on shared deployment. For all shared
        deployment requests, enforce the listed roles; 401/403 are explicit failures. See completion decision AUTH-01.
        Amendment1.3.2 requires authentication and machine-scope checks; any legacy optional-auth wording is superseded.'
      x-maintai-source: baseline 10.3/11; completion ACTION-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Transition committed; refresh alert detail after success.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AlertTransitionResult'
                - properties:
                    previous_status:
                      enum:
                      - ACKNOWLEDGED
                      - IN_PROGRESS
                      - ESCALATED
                    status:
                      const: RESOLVED
              examples:
                resolve_response:
                  externalValue: ../examples/http/backend/resolve-response.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
        '409':
          $ref: '#/components/responses/INVALID_ALERT_TRANSITION'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
            examples:
              resolve_request:
                externalValue: ../examples/http/backend/resolve-request.json
      x-maintai-roles:
      - TECHNICIAN
