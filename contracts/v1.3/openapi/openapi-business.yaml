      x-maintai-source: baseline 15.5; completion BRIEF-01, AUDIT-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Alert, source context, prediction, copilot status and audit history.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
              examples:
                alert_detail:
                  externalValue: ../examples/http/backend/alert-detail.json
                alert_rag_unavailable:
                  externalValue: ../examples/http/backend/alert-rag-unavailable.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
  /api/v1/alerts/{alert_id}/ack:
    post:
      operationId: alertAck
      tags:
      - Alerts
      summary: Ack alert
      description: 'Allowed source statuses: OPEN; target: ACKNOWLEDGED. Atomically validate transition,
        update status and append audit history. Every other transition, including repeating a completed
        action, returns 409. With auth enabled actor_id must match the authenticated principal (otherwise
        403); actor_id alone grants no authority. Authentication is required on shared deployment. For
        all shared deployment requests, enforce the listed roles; 401/403 are explicit failures. See completion
        decision AUTH-01. Amendment1.3.2 requires authentication and machine-scope checks; any legacy
        optional-auth wording is superseded.'
      x-maintai-source: baseline 10.3/11; completion ACTION-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Transition committed; refresh alert detail after success.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AlertTransitionResult'
                - properties:
                    previous_status:
                      enum:
                      - OPEN
                    status:
                      const: ACKNOWLEDGED
              examples:
                ack_response:
                  externalValue: ../examples/http/backend/ack-response.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
        '409':
          $ref: '#/components/responses/INVALID_ALERT_TRANSITION'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorNote'
            examples:
              ack_request:
                externalValue: ../examples/http/backend/ack-request.json
      x-maintai-roles:
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
      x-maintai-transitions:
        from:
        - OPEN
        to: ACKNOWLEDGED
