        exists. Authentication is required on shared deployment. For all shared deployment requests, enforce
        the listed roles; 401/403 are explicit failures. See completion decision AUTH-01. Amendment1.3.2
        requires authentication and machine-scope checks; any legacy optional-auth wording is superseded.
      x-maintai-source: baseline 15.4; completion PAGE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: limit
        in: query
        required: false
        description: Maximum items returned.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Offset into the filtered, ordered collection. total is the count before pagination.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: status
        in: query
        required: false
        description: Optional lifecycle status.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/AlertStatus
      - name: severity
        in: query
        required: false
        description: Optional severity.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/AlertSeverity
      - name: machine_id
        in: query
        required: false
        description: Optional machine filter.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Alert page.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
              examples:
                alerts:
                  externalValue: ../examples/http/backend/alerts.json
                alerts_empty:
