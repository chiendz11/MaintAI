openapi: 3.1.1
info:
  title: MaintAI Business REST/SSE API
  version: 2.0.0
  description: Description revision2.0.0 freezes M6-HISTORY-01/1.0.0 history/export interfaces. Existing
    M1-M5 runtime DTOs and Kafka bundle remain unchanged; M6 routes are specification only.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://business.example.invalid
  description: Illustrative only; configure environment routing.
externalDocs:
  description: M6 history architecture and migration
  url: ../../../docs/M6_HISTORY_ARCHITECTURE_DECISION.md
x-maintai-decisions: ../../../docs/api-contract-decisions.md
tags:
- name: Sensor
  description: Simulator ingestion and idempotency
- name: Machines
  description: Fleet, current machine state and historical readings
- name: Alerts
  description: Alert reads and lifecycle
- name: Feedback
  description: Technician feedback without automatic retraining
- name: Copilot
  description: Backend facade for cached/generated RAG briefs
- name: Monitoring
  description: Service status and persisted batch reports
- name: Realtime
  description: Optional SSE invalidation notifications
- name: Operations
  description: Platform health and metrics
security:
- BearerAuth: []
paths:
  /api/v1/machines:
    get:
      operationId: listMachines
      tags:
      - Machines
      summary: List fleet state
      description: Order machine_id ASC. Empty filtered results return 200 with items=[] and total=0.
        INVALID/UNKNOWN are explicit states with no current risk score; do not render them as NORMAL.
        Authentication is required on shared deployment. For all shared deployment requests, enforce the
        listed roles; 401/403 are explicit failures. See completion decision AUTH-01. Amendment1.3.2 requires
        authentication and machine-scope checks; any legacy optional-auth wording is superseded.
      x-maintai-source: baseline 15.1; completion PAGE-01, STATE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: limit
        in: query
        required: false
        description: Maximum items returned.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Offset into the filtered, ordered collection. total is the count before pagination.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: state
        in: query
        required: false
        description: Optional operational-state filter.
        schema:
          $ref: ../schemas/common.schema.json#/$defs/MachineState
      responses:
        '200':
          description: Fleet page.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineList'
              examples:
                machines:
                  externalValue: ../examples/http/backend/machines.json
                machines_empty:
                  externalValue: ../examples/http/backend/machines-empty.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
  /api/v1/machines/{machine_id}:
    get:
      operationId: getMachine
      tags:
      - Machines
      summary: Get current machine detail
      description: latest_prediction describes the current event only; it is null for INVALID/UNKNOWN.
        Historical predictions remain available through historical records; do not silently reuse an old
        prediction as the current result. Authentication is required on shared deployment. For all shared
        deployment requests, enforce the listed roles; 401/403 are explicit failures. See completion decision
        AUTH-01. Amendment1.3.2 requires authentication and machine-scope checks; any legacy optional-auth
        wording is superseded.
      x-maintai-source: baseline 15.2; completion STATE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: machine_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Current state with nullable absent data.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineDetail'
              examples:
                machine_detail:
                  externalValue: ../examples/http/backend/machine-detail.json
                machine_unknown:
                  externalValue: ../examples/http/backend/machine-unknown.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/MACHINE_NOT_FOUND'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
  /api/v1/machines/{machine_id}/sensor-readings:
    get:
      operationId: listRawHistory
      summary: Read accepted raw history with explicit coverage
      description: M6-HISTORY-01/1.0.0; design only, no M6 runtime rollout. Read API uses SELECT-only
        source pool plus a separate metadata writer pool for snapshots/jobs. Original outcomes stay in
        PostgreSQL; no processed archive or source cleanup in M6. UTC microseconds; every page/job/download
        rechecks current actor and machine scope. Read accepted timeline receipts via pinned raw catalog
        generation, order received_at DESC,topic DESC,partition DESC,offset DESC; preserve duplicate source
        events at different locators. Rejected/poison missing machine/time do not enter this collection.
        Default last1h, range<=31d, snapshot10m/100000 IDs. Nullable time availability with explicit partition
        coverage; uncertain required coverage returns503, never partial/empty success.
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      parameters:
      - name: machine_id
        in: path
        required: true
        schema: &id002
          type: string
          minLength: 1
      - name: from
        in: query
        required: false
        schema: &id001
          type: string
          format: date-time
        description: Inclusive Clock selected by metric collection.
      - name: to
        in: query
        required: false
        schema: *id001
        description: Exclusive Clock selected by metric collection.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        required: false
        schema: *id002
        description: Opaque authenticated M6 token binding profile, collection, frozen query, actor/scope,
          snapshot, sort/last key, key version and expiry; legacy tokens rejected.
      - name: X-MaintAI-History-Profile
        in: header
        required: true
        schema:
          type: string
          const: M6-HISTORY-01/1.0.0
        description: Explicit opt-in; absent/other profile is rejected, never reinterpret a baseline cursor.
      responses:
        '400':
          description: Invalid request/cursor.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '401':
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '403':
          description: Insufficient permission or machine scope.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '404':
          description: Resource not found/not materialized.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '409':
          description: Idempotency, state or version conflict.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '410':
          description: History/snapshot/artifact expired.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '422':
          description: Invalid query/payload or query budget exceeded.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '429':
          description: Admission limit exceeded.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '503':
          description: Required dependency/coverage unavailable.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '504':
          description: Dependency timed out.
          content:
            application/json:
              schema:
                $ref: ../schemas/runtime.schema.json#/$defs/Error
        '200':
          description: Persisted result.
          content:
            application/json:
              schema:
                $ref: ../schemas/history-m6.schema.json#/$defs/RawHistoryPage
              examples:
                m6:
                  externalValue: ../examples/m6/raw-page-offset-coverage.json
      security:
      - BearerAuth: []
      x-maintai-history-profile: M6-HISTORY-01/1.0.0
  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags:
      - Alerts
      summary: List alerts
      description: Order created_at DESC, alert_id DESC; total counts matching rows before limit/offset.
