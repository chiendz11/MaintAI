        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - BearerAuth: []
  /api/v1/alerts/{alert_id}:
    get:
      operationId: getAlert
      tags:
      - Alerts
      summary: Get alert detail
      description: Alert severity and lifecycle remain independent of copilot availability. Return current
