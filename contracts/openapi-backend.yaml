openapi: 3.1.1
info:
  title: MaintAI Backend API
  version: 1.1.0
  description: 'Design contract, not evidence that endpoints are deployed. Baseline: System Contracts v1.1 DRIFT.
    Completion decisions and HTTP/UI state semantics: docs/api-contract-decisions.md. Frontend calls backend only;
    ML/RAG are internal provider APIs.'
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: http://localhost:8000
  description: Illustrative local URL; override for the environment.
externalDocs:
  description: Human-readable baseline
  url: https://github.com/chiendz11/MaintAI/blob/main/docs/MaintAI_System_Contracts_v1_1_DRIFT.md
x-maintai-decisions: ../docs/api-contract-decisions.md
tags:
- name: Sensor
  description: Simulator ingestion and idempotency
- name: Machines
  description: Fleet, current machine state and historical readings
- name: Alerts
  description: Alert reads and lifecycle
- name: Feedback
  description: Technician feedback without automatic retraining
- name: Copilot
  description: Backend facade for cached/generated RAG briefs
- name: Monitoring
  description: Service status and persisted batch reports
- name: Realtime
  description: Optional SSE invalidation notifications
- name: Operations
  description: Platform health and metrics
security: []
paths:
  /api/v1/sensor-readings:
    post:
      operationId: ingestSensorReading
      tags:
      - Sensor
      summary: Validate and process one sensor event
      description: 'event_id is the idempotency key. machine_id must be provisioned/seeded; unknown machine returns
        404. Identical canonical payload returns its stored outcome without a second prediction or alert; a conflicting
        payload returns 409. Identifiable invalid events use the baseline SensorInvalid response; unusable IDs use
        the standard VALIDATION_FAILED envelope. VALID events with exhausted ML failures return 503/504 plus UNKNOWN
        and null prediction/alert. Persist validation results before inference; never await RAG before responding.
        Authentication is deployment-profile dependent: anonymous is only the auth-disabled prototype profile. With
        auth enabled, enforce the listed roles; 401/403 are explicit failures. See completion decision AUTH-01.'
      x-maintai-source: baseline
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Valid event processed or identical stored outcome.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorCompleted'
              examples:
                sensor_completed:
                  externalValue: ./examples/backend/sensor-completed.json
        '422':
          description: 'Identifiable invalid event: SensorInvalid, no ML call. Missing/invalid event_id or machine_id:
            standard VALIDATION_FAILED envelope.'
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SensorInvalid'
                - allOf:
                  - $ref: ./schemas/common.schema.json#/$defs/ErrorEnvelope
                  - properties:
                      error:
                        properties:
                          code:
                            const: VALIDATION_FAILED
              examples:
                sensor_invalid:
                  externalValue: ./examples/backend/sensor-invalid.json
                validation_failed:
                  externalValue: ./examples/errors/validation_failed.json
        '503':
          description: ML unavailable after bounded retries; event state UNKNOWN.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            Retry-After:
              description: Optional retry delay in seconds. Honor it before bounded retries.
              schema:
                type: string
                pattern: ^[0-9]+$
              example: '2'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SensorDependencyFailure'
                - properties:
                    error:
                      properties:
                        code:
                          const: ML_UNAVAILABLE
              examples:
                sensor_ml_unavailable:
                  externalValue: ./examples/backend/sensor-ml_unavailable.json
        '504':
          description: ML timed out after bounded retries; event state UNKNOWN.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            Retry-After:
              description: Optional retry delay in seconds. Honor it before bounded retries.
              schema:
                type: string
                pattern: ^[0-9]+$
              example: '2'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SensorDependencyFailure'
                - properties:
                    error:
                      properties:
                        code:
                          const: ML_TIMEOUT
              examples:
                sensor_ml_timeout:
                  externalValue: ./examples/backend/sensor-ml_timeout.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/MACHINE_NOT_FOUND'
        '409':
          $ref: '#/components/responses/EVENT_CONFLICT'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorEvent'
            examples:
              sensor_event:
                externalValue: ./examples/backend/sensor-event.json
      x-maintai-roles:
      - SENSOR_SERVICE
      security:
      - serviceApiKey: []
      - {}
  /api/v1/machines:
    get:
      operationId: listMachines
      tags:
      - Machines
      summary: List fleet state
      description: 'Order machine_id ASC. Empty filtered results return 200 with items=[] and total=0. INVALID/UNKNOWN
        are explicit states with no current risk score; do not render them as NORMAL. Authentication is deployment-profile
        dependent: anonymous is only the auth-disabled prototype profile. With auth enabled, enforce the listed
        roles; 401/403 are explicit failures. See completion decision AUTH-01.'
      x-maintai-source: baseline 15.1; completion PAGE-01, STATE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: limit
        in: query
        required: false
        description: Maximum items returned.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Offset into the filtered, ordered collection. total is the count before pagination.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: state
        in: query
        required: false
        description: Optional operational-state filter.
        schema:
          $ref: ./schemas/common.schema.json#/$defs/MachineState
      responses:
        '200':
          description: Fleet page.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineList'
              examples:
                machines:
                  externalValue: ./examples/backend/machines.json
                machines_empty:
                  externalValue: ./examples/backend/machines-empty.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - bearerAuth: []
      - {}
  /api/v1/machines/{machine_id}:
    get:
      operationId: getMachine
      tags:
      - Machines
      summary: Get current machine detail
      description: 'latest_prediction describes the current event only; it is null for INVALID/UNKNOWN. Historical
        predictions remain available through historical records; do not silently reuse an old prediction as the
        current result. Authentication is deployment-profile dependent: anonymous is only the auth-disabled prototype
        profile. With auth enabled, enforce the listed roles; 401/403 are explicit failures. See completion decision
        AUTH-01.'
      x-maintai-source: baseline 15.2; completion STATE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: machine_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Current state with nullable absent data.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineDetail'
              examples:
                machine_detail:
                  externalValue: ./examples/backend/machine-detail.json
                machine_unknown:
                  externalValue: ./examples/backend/machine-unknown.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/MACHINE_NOT_FOUND'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - bearerAuth: []
      - {}
  /api/v1/machines/{machine_id}/sensor-readings:
    get:
      operationId: listSensorReadings
      tags:
      - Machines
      summary: Get sensor history
      description: 'Order received_at DESC, event_id DESC. Follow both next_before and next_before_event_id for
        lossless keyset pagination across equal timestamps. before alone means strictly earlier timestamps for baseline
        compatibility. before_event_id requires before. INVALID records retain raw features and validation issues,
        with prediction_id=null. Authentication is deployment-profile dependent: anonymous is only the auth-disabled
        prototype profile. With auth enabled, enforce the listed roles; 401/403 are explicit failures. See completion
        decision AUTH-01.'
      x-maintai-source: baseline 15.3; completion PAGE-02
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: machine_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        description: Maximum records returned.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: before
        in: query
        required: false
        description: Exclusive timestamp cursor; use both returned cursor fields.
        schema:
          type: string
          format: date-time
      - name: before_event_id
        in: query
        required: false
        description: Tie-breaker for rows with the before timestamp; requires before.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Historical readings; both next cursors null at the end.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorHistory'
              examples:
                sensor_history:
                  externalValue: ./examples/backend/sensor-history.json
                sensor_history_page:
                  externalValue: ./examples/backend/sensor-history-page.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/MACHINE_NOT_FOUND'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - bearerAuth: []
      - {}
  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags:
      - Alerts
      summary: List alerts
      description: 'Order created_at DESC, alert_id DESC; total counts matching rows before limit/offset. An unknown
        filter machine_id produces an empty result rather than claiming the machine resource exists. Authentication
        is deployment-profile dependent: anonymous is only the auth-disabled prototype profile. With auth enabled,
        enforce the listed roles; 401/403 are explicit failures. See completion decision AUTH-01.'
      x-maintai-source: baseline 15.4; completion PAGE-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: limit
        in: query
        required: false
        description: Maximum items returned.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Offset into the filtered, ordered collection. total is the count before pagination.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: status
        in: query
        required: false
        description: Optional lifecycle status.
        schema:
          $ref: ./schemas/common.schema.json#/$defs/AlertStatus
      - name: severity
        in: query
        required: false
        description: Optional severity.
        schema:
          $ref: ./schemas/common.schema.json#/$defs/AlertSeverity
      - name: machine_id
        in: query
        required: false
        description: Optional machine filter.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Alert page.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
              examples:
                alerts:
                  externalValue: ./examples/backend/alerts.json
                alerts_empty:
                  externalValue: ./examples/backend/alerts-empty.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - bearerAuth: []
      - {}
  /api/v1/alerts/{alert_id}:
    get:
      operationId: getAlert
      tags:
      - Alerts
      summary: Get alert detail
      description: 'Alert severity and lifecycle remain independent of copilot availability. Return current CopilotSummary
        and history ordered timestamp ASC, alert_event_id ASC. Fetch full brief via the backend /brief endpoint;
        frontend never calls RAG directly. Authentication is deployment-profile dependent: anonymous is only the
        auth-disabled prototype profile. With auth enabled, enforce the listed roles; 401/403 are explicit failures.
        See completion decision AUTH-01.'
      x-maintai-source: baseline 15.5; completion BRIEF-01, AUDIT-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Alert, source context, prediction, copilot status and audit history.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
              examples:
                alert_detail:
                  externalValue: ./examples/backend/alert-detail.json
                alert_rag_unavailable:
                  externalValue: ./examples/backend/alert-rag-unavailable.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
      x-maintai-roles:
      - VIEWER
      - TECHNICIAN
      - ADMIN
      security:
      - bearerAuth: []
      - {}
  /api/v1/alerts/{alert_id}/ack:
    post:
      operationId: alertAck
      tags:
      - Alerts
      summary: Ack alert
      description: 'Allowed source statuses: OPEN; target: ACKNOWLEDGED. Atomically validate transition, update
        status and append audit history. Every other transition, including repeating a completed action, returns
        409. With auth enabled actor_id must match the authenticated principal (otherwise 403); actor_id alone grants
        no authority. Authentication is deployment-profile dependent: anonymous is only the auth-disabled prototype
        profile. With auth enabled, enforce the listed roles; 401/403 are explicit failures. See completion decision
        AUTH-01.'
      x-maintai-source: baseline 10.3/11; completion ACTION-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Transition committed; refresh alert detail after success.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AlertTransitionResult'
                - properties:
                    previous_status:
                      enum:
                      - OPEN
                    status:
                      const: ACKNOWLEDGED
              examples:
                ack_response:
                  externalValue: ./examples/backend/ack-response.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
        '409':
          $ref: '#/components/responses/INVALID_ALERT_TRANSITION'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorNote'
            examples:
              ack_request:
                externalValue: ./examples/backend/ack-request.json
      x-maintai-roles:
      - TECHNICIAN
      - ADMIN
      security:
      - bearerAuth: []
      - {}
      x-maintai-transitions:
        from:
        - OPEN
        to: ACKNOWLEDGED
  /api/v1/alerts/{alert_id}/start:
    post:
      operationId: alertStart
      tags:
      - Alerts
      summary: Start alert
      description: 'Allowed source statuses: ACKNOWLEDGED, ESCALATED; target: IN_PROGRESS. Atomically validate transition,
        update status and append audit history. Every other transition, including repeating a completed action,
        returns 409. With auth enabled actor_id must match the authenticated principal (otherwise 403); actor_id
        alone grants no authority. Authentication is deployment-profile dependent: anonymous is only the auth-disabled
        prototype profile. With auth enabled, enforce the listed roles; 401/403 are explicit failures. See completion
        decision AUTH-01.'
      x-maintai-source: baseline 10.3/11; completion ACTION-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Transition committed; refresh alert detail after success.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AlertTransitionResult'
                - properties:
                    previous_status:
                      enum:
                      - ACKNOWLEDGED
                      - ESCALATED
                    status:
                      const: IN_PROGRESS
              examples:
                start_response:
                  externalValue: ./examples/backend/start-response.json
        '400':
          $ref: '#/components/responses/INVALID_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '422':
          $ref: '#/components/responses/VALIDATION_FAILED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/DEPENDENCY_UNAVAILABLE'
        '404':
          $ref: '#/components/responses/ALERT_NOT_FOUND'
        '409':
          $ref: '#/components/responses/INVALID_ALERT_TRANSITION'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorNote'
            examples:
              start_request:
                externalValue: ./examples/backend/start-request.json
      x-maintai-roles:
      - TECHNICIAN
      - ADMIN
      security:
      - bearerAuth: []
      - {}
      x-maintai-transitions:
        from:
        - ACKNOWLEDGED
        - ESCALATED
        to: IN_PROGRESS
  /api/v1/alerts/{alert_id}/escalate:
    post:
      operationId: alertEscalate
      tags:
      - Alerts
      summary: Escalate alert
      description: 'Allowed source statuses: OPEN, ACKNOWLEDGED, IN_PROGRESS; target: ESCALATED. Atomically validate
        transition, update status and append audit history. Every other transition, including repeating a completed
        action, returns 409. With auth enabled actor_id must match the authenticated principal (otherwise 403);
        actor_id alone grants no authority. Authentication is deployment-profile dependent: anonymous is only the
        auth-disabled prototype profile. With auth enabled, enforce the listed roles; 401/403 are explicit failures.
        See completion decision AUTH-01.'
      x-maintai-source: baseline 10.3/11; completion ACTION-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - name: alert_id
        in: path
        required: true
        description: Opaque identifier; do not parse identity or ordering from its format.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Transition committed; refresh alert detail after success.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
