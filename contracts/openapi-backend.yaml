                $ref: '#/components/schemas/Liveness'
              examples:
                backend_live:
                  externalValue: ./examples/operations/backend-live.json
      security: []
  /health/ready:
    get:
      operationId: backendReadiness
      tags:
      - Operations
      summary: Dependency readiness
      description: 200 only when ready for the service function; 503 when required checks fail, including DEGRADED
        RAG. Readiness bodies intentionally use the health schema rather than the business error envelope. Platform
        may configure RAG separately because RAG failure must not remove backend alert functionality.
      x-maintai-source: baseline 19.2; completion HEALTH-01
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ready.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Readiness'
                - properties:
                    status:
                      const: UP
              examples:
                backend_ready:
                  externalValue: ./examples/operations/backend-ready.json
        '503':
          description: Not ready; inspect checks.
          headers:
            X-Request-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            X-Correlation-ID:
              description: Generated or propagated identifier for tracing this response.
              schema:
                type: string
                minLength: 1
            Retry-After:
              description: Optional retry delay in seconds. Honor it before bounded retries.
              schema:
                type: string
                pattern: ^[0-9]+$
              example: '2'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Readiness'
                - properties:
                    status:
                      type: string
                      enum:
                      - DEGRADED
                      - DOWN
              examples:
                backend_not_ready:
                  externalValue: ./examples/operations/backend-not-ready.json
      security: []
  /metrics:
    get:
      operationId: backendMetrics
      tags:
      - Operations
      summary: Prometheus metrics
      description: Platform scrape endpoint, not a frontend data API. Example is illustrative; actual service metrics
        follow baseline section 20. Do not label metrics with unique event/machine/report IDs.
      x-maintai-source: baseline 20
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
              examples:
                exposition:
                  externalValue: ./examples/operations/backend-metrics.prom
      security: []
