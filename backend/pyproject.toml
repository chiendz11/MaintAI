[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai-business"
version = "0.1.0"
description = "Business owner registry foundation in the existing skeleton"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1"]

[project.scripts]
maintai-business-api = "api.main:main"
maintai-business-migrate = "backend.shared.persistence.migration:main"
maintai-business-provision = "backend.shared.persistence.provision:main"

[tool.setuptools]
packages = ["backend", "backend.shared", "backend.shared.persistence", "backend.migrations", "backend.migrations.versions", "api"]
package-dir = {backend = ".", api = "business-api/src/api"}

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["business-api/tests"]
pythonpath = ["business-api/src", ".."]
markers = ["integration: opt-in PostgreSQL or Docker tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
