[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai-messaging"
version = "0.2.0"
description = "MaintAI Kafka contracts, durable delivery and integration adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["confluent-kafka==2.16.0", "jsonschema[format-nongpl]==4.26.0"]

[project.optional-dependencies]
observability = ["prometheus-client==0.26.0"]
postgres = ["psycopg[binary]==3.3.6"]
s3 = ["boto3==1.43.114"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "build>=1,<2", "PyYAML>=6,<7"]

[project.scripts]
maintai-kafka = "maintai_messaging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
markers = ["integration: needs explicitly configured local Kafka and PostgreSQL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
