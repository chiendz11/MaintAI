[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai-drift-worker"
version = "0.1.0"
description = "One-shot distribution monitoring for MaintAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3", "pydantic>=2.10,<3", "PyYAML>=6.0,<7",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "pytest-cov>=6,<8", "jsonschema[format-nongpl]>=4.23,<5",
  "ruff>=0.11,<1", "build>=1,<2", "pip-audit>=2.9,<3",
]

[project.scripts]
maintai-drift = "drift_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drift_monitor = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
markers = ["postgres: needs DRIFT_TEST_DATABASE_URL and an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
