[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai-storage-consumer"
version = "0.2.0"
description = "MaintAI raw Kafka archive runtime with immutable S3 receipts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["maintai-messaging[s3]==0.3.0", "prometheus-client==0.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "build==1.6.1"]

[project.scripts]
maintai-storage = "maintai_storage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["maintai_storage*"]

[tool.setuptools.package-data]
maintai_storage = ["schemas/*.json", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
markers = ["integration: explicit local Kafka and S3-compatible endpoint required"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["maintai_storage"]
