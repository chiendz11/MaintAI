name: maintai-m6
services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports:
      - "127.0.0.1:${MAINTAI_M2_KAFKA_PORT:-40092}:19092"
    environment:
      CLUSTER_ID: m7ai0W0uTzm5QwoOfT6i1A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${MAINTAI_M2_KAFKA_PORT:-40092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, kafka:9092]
      interval: 5s
      timeout: 10s
      retries: 30
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:${MAINTAI_M2_DB_PORT:-36432}:5432"
    environment:
      POSTGRES_DB: maintai_processing_test
      POSTGRES_USER: maintai_test
      POSTGRES_PASSWORD: maintai_test
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U maintai_test -d maintai_processing_test]
      interval: 2s
      timeout: 5s
      retries: 30
  minio:
    image: maintai-minio:m6-test
    build:
      context: .
      dockerfile: Minio.Dockerfile
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:39000:9000"
      - "127.0.0.1:39001:9001"
    environment:
      MINIO_ROOT_USER: maintai_m6_test
      MINIO_ROOT_PASSWORD: maintai_m6_test_only
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/live', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  minio-data:
  kafka-data:
  postgres-data:
