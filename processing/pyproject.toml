[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai-processing"
version = "0.1.0"
description = "MaintAI Processing components in the existing owner skeleton"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5", "maintai-messaging[postgres,observability]==0.2.0",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "alembic>=1.14,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "prometheus-client>=0.21,<1",
]

[project.scripts]
maintai-processing-worker = "maintai_processing.app_entrypoints:worker"
maintai-processing-relay = "maintai_processing.app_entrypoints:relay"
maintai-processing-migrate = "processing.shared.persistence.connection:main"

# Explicit mapping keeps implementation in shared/* instead of adding a source tree.
[tool.setuptools]
packages = [
  "processing", "processing.shared", "processing.shared.data_quality",
  "processing.shared.risk_engine", "processing.shared.inference_client",
  "processing.shared.persistence", "processing.shared.events", "processing.shared.ordering",
  "processing.shared.outbox", "processing.migrations", "processing.migrations.versions",
  "consumer", "relay", "maintai_processing",
]
package-dir = {processing = ".", consumer = "worker/src/consumer", relay = "outbox-relay/src/relay", maintai_processing = "src/maintai_processing"}

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["worker/tests", "outbox-relay/tests", "tests"]
pythonpath = ["worker/src", "outbox-relay/src", "src"]
markers = ["integration: opt-in real DB, Kafka or Docker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
