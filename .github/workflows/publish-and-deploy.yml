name: Build, Publish and Deploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated or "all")'
        required: true
        default: 'all'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'drift-worker/**'
      - 'processing/**'
      - 'frontend/**'
      - 'ingestion-connect/**'
      - 'ml-service/**'
      - 'platform/keycloak/**'
      - 'rag-service/**'
      - 'sensor/**'
      - 'sensor-simulator-UI/**'
      - 'storage-consumer/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
            image: maintai-frontend
            build_args: ""
          - name: simulator-ui
            context: sensor-simulator-UI
            dockerfile: sensor-simulator-UI/Dockerfile
            image: maintai-simulator-ui
            build_args: |
              NODE_IMAGE=node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
              NGINX_IMAGE=nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          - name: ingestion-connect
            context: .
            dockerfile: ingestion-connect/Dockerfile
            image: maintai-ingestion-connect
            build_args: ""
          - name: sensor
            context: sensor
            dockerfile: sensor/Dockerfile
            image: maintai-sensor
            build_args: ""
          - name: drift-worker
            context: drift-worker
            dockerfile: drift-worker/Dockerfile
            image: maintai-drift-worker
            build_args: ""
          - name: business-api
            context: .
            dockerfile: backend/business-api/Dockerfile
            image: maintai-business-api
            build_args: ""
          - name: business-consumer
            context: .
            dockerfile: backend/business-consumer/Dockerfile
            image: maintai-business-consumer
            build_args: ""
          - name: processing-worker
            context: .
            dockerfile: processing/worker/Dockerfile
            image: maintai-processing-worker
            build_args: ""
          - name: processing-read-api
            context: .
            dockerfile: processing/read-api/Dockerfile
            image: maintai-processing-read-api
            build_args: ""
          - name: processing-outbox-relay
            context: .
            dockerfile: processing/outbox-relay/Dockerfile
            image: maintai-processing-outbox-relay
            build_args: ""
          - name: storage-consumer
            context: .
            dockerfile: storage-consumer/Dockerfile
            image: maintai-storage-consumer
            build_args: ""
          - name: ml-service
            context: .
            dockerfile: ml-service/inference/Dockerfile
            image: maintai-ml-service
            build_args: ""
          - name: training
            context: .
            dockerfile: ml-service/training/Dockerfile
            image: maintai-training
            build_args: |
              SOURCE_REVISION=${{ github.sha }}
          - name: automation
            context: .
            dockerfile: ml-service/automation/Dockerfile
            image: maintai-automation
            build_args: ""
          - name: rag-service
            context: .
            dockerfile: rag-service/Dockerfile
            image: maintai-rag-service
            build_args: ""
          - name: keycloak
            context: platform/keycloak
            dockerfile: platform/keycloak/Dockerfile
            image: maintai-keycloak
            build_args: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if service selected
        id: check_select
        run: |
          SERVICES="${{ github.event.inputs.services || 'all' }}"
          if [ "$SERVICES" = "all" ] || echo ",$SERVICES," | grep -q ",${{ matrix.name }},"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check_select.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check_select.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: steps.check_select.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
