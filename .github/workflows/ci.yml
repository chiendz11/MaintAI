name: MaintAI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check component folders
        run: |
          test -f README.md
          for component in sensor ingestion-api processing storage-consumer backend frontend sensor-simulator-UI ml-service rag-service drift-worker messaging; do
            test -d "$component"
            printf 'Found %s/\n' "$component"
          done

      - name: Report skeleton status
        run: |
          printf '%s\n' \
            '## MaintAI CI' \
            'Repository structure checked.' \
            'API contracts are validated; Sensor and Drift Worker CI run tests/build and container integration.' \
            >> "$GITHUB_STEP_SUMMARY"

  api-contracts:
    name: API contracts
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contracts/requirements.lock

      - name: Install contract validation tools
        run: python -m pip install -r contracts/requirements.lock

      - name: Validate current OpenAPI, schemas and examples
        run: python contracts/v1.3/validate.py

  repo-metadata:
    name: Docs and runtime metadata
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify document hashes, local references and runtime inventory
        run: python3 .github/scripts/check_repository.py

  kafka-ci:
    name: Kafka SDK (Python ${{ matrix.python }})
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: messaging/requirements-dev.lock

      - name: Install locked SDK dependencies
        run: |
          python -m pip install -r messaging/requirements-dev.lock
          python -m pip install --no-deps -e ./messaging
          python -m pip install --no-deps -e ./processing

      - name: Lint, immutable schemas and failure semantics
        run: |
          ruff check messaging processing/src processing/tests --config messaging/pyproject.toml
          ruff format --check messaging processing/src processing/tests --config messaging/pyproject.toml
          python messaging/scripts/lock_contracts.py --check
          maintai-kafka validate-contracts
          python -m pytest -c messaging/pyproject.toml messaging/tests/unit processing/tests --junitxml=artifacts/kafka-unit.xml

      - name: Build source distribution and wheel with bundled contracts
        run: |
          python -m build messaging
          python -m build processing

      - name: Verify installed wheel without repository fallback
        run: |
          python -m venv "$RUNNER_TEMP/messaging-wheel"
          "$RUNNER_TEMP/messaging-wheel/bin/python" -m pip install -r messaging/requirements.lock
          "$RUNNER_TEMP/messaging-wheel/bin/python" -m pip install --no-deps messaging/dist/*.whl
          "$RUNNER_TEMP/messaging-wheel/bin/python" -m pip install --no-deps processing/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/messaging-wheel/bin/maintai-kafka" validate-contracts
          "$RUNNER_TEMP/messaging-wheel/bin/maintai-processing-worker" --help
          "$RUNNER_TEMP/messaging-wheel/bin/maintai-processing-relay" --help

  kafka-integration:
    name: Kafka and PostgreSQL durable delivery
    needs: kafka-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: maintai-kafka-ci
      MAINTAI_KAFKA_INTEGRATION: '1'
      KAFKA_TEST_BOOTSTRAP_SERVERS: 127.0.0.1:19092
      KAFKA_TEST_DATABASE_URL: postgresql://maintai_dev:maintai_dev@127.0.0.1:15432/maintai_messaging_dev
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: messaging/requirements-dev.lock

      - name: Install locked SDK dependencies
        run: |
          python -m pip install -r messaging/requirements-dev.lock
          python -m pip install --no-deps -e ./messaging

      - name: Start isolated development broker and database
        run: docker compose -f messaging/tests/integration/compose.yaml up -d --wait --wait-timeout 180

      - name: Verify keyed offsets, DB generations, ordered heads and broker delivery
        run: python -m pytest messaging/tests/integration --junitxml=artifacts/kafka-integration.xml

      - name: Upload Kafka integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kafka-integration-results
          path: artifacts/kafka-integration.xml
          retention-days: 7

      - name: Remove CI-only containers and volumes
        if: ${{ always() }}
        run: docker compose -f messaging/tests/integration/compose.yaml down --volumes

  sensor-ci:
    name: Sensor CI (Python ${{ matrix.python }})
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sensor/requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install -r sensor/requirements-dev.lock
          python -m pip install --no-deps -e ./sensor

      - name: Lint and format
        run: |
          ruff check sensor .github/scripts sensor-simulator-UI/tests/provider --config sensor/pyproject.toml
          ruff format --check sensor .github/scripts sensor-simulator-UI/tests/provider --config sensor/pyproject.toml

      - name: Contract, persistence, restart, scoped JWT and TLS OAuth tests
        run: |
          mkdir -p "$RUNNER_TEMP/sensor-test-results"
          python -m pytest sensor/tests --cov=simulator --cov-report=term-missing \
            --cov-report="xml:$RUNNER_TEMP/sensor-test-results/coverage.xml" \
            --junitxml="$RUNNER_TEMP/sensor-test-results/junit.xml"

      - name: Retain Sensor test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sensor-tests-python-${{ matrix.python }}
          path: ${{ runner.temp }}/sensor-test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Python distribution
        run: python -m build sensor

      - name: Verify wheel and bundled scenarios outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/sensor-wheel"
          "$RUNNER_TEMP/sensor-wheel/bin/python" -m pip install -r sensor/requirements.lock
          "$RUNNER_TEMP/sensor-wheel/bin/python" -m pip install --no-deps sensor/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sensor-wheel/bin/python" - <<'PY'
          import importlib
          from pathlib import Path
          import sys

          for module in (
              "simulator.control.api", "simulator.control.auth", "simulator.ordering.store",
              "simulator.scheduling.engine", "simulator.retry_spool.replay", "simulator.metrics",
          ):
              importlib.import_module(module)
          for name in ("normal", "degradation", "critical", "recovery"):
              assert (Path(sys.prefix) / "share/maintai-sensor/scenarios" / (name + ".yaml")).is_file()
          PY
          "$RUNNER_TEMP/sensor-wheel/bin/maintai-sensor" replay \
            --dataset "$GITHUB_WORKSPACE/sensor/tests/fixtures/ai4i_sample.csv" --dry-run --limit 2

      - name: Audit runtime dependencies
        if: matrix.python == '3.12'
        continue-on-error: true
        run: pip-audit --disable-pip --no-deps -r sensor/requirements.lock

  sensor-container:
    name: Sensor container smoke test
    needs: sensor-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build sensor image
        run: docker build --tag maintai-sensor:ci sensor

      - name: Run offline container smoke test
        run: |
          docker run --rm --network none \
            --volume "$PWD/sensor/tests/fixtures/ai4i_sample.csv:/app/data/ai4i2020.csv:ro" \
            maintai-sensor:ci replay --dry-run --limit 2

      - name: Verify Sensor runtime, non-root state and restart persistence in container
        run: python3 .github/scripts/container_smoke.py sensor --image maintai-sensor:ci

  drift-ci:
    name: Drift Worker CI
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: maintai_test
          POSTGRES_USER: maintai_test
          POSTGRES_PASSWORD: maintai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintai_test -d maintai_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DRIFT_TEST_DATABASE_URL: postgresql://maintai_test:maintai_test@localhost:5432/maintai_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            drift-worker/requirements-dev.lock
            sensor/requirements.lock

      - name: Install locked dependencies and test sensor
        run: |
          python -m pip install -r drift-worker/requirements-dev.lock -r sensor/requirements.lock
          python -m pip install --no-deps -e ./drift-worker -e ./sensor

      - name: Lint and format
        run: |
          ruff check drift-worker
          ruff format --check drift-worker

      - name: Unit, contract, PostgreSQL and sensor scenario tests
        run: python -m pytest drift-worker/tests --cov=drift_monitor --cov-report=term-missing

      - name: Build Python distribution
        run: python -m build drift-worker

      - name: Audit runtime dependencies
        continue-on-error: true
        run: pip-audit --disable-pip --no-deps -r drift-worker/requirements.lock

  drift-container:
    name: Sensor and Drift Worker container integration
    needs: drift-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: drift-worker/requirements-dev.lock

      - name: Install test harness dependencies
        run: |
          python -m pip install -r drift-worker/requirements-dev.lock
          python -m pip install --no-deps -e ./drift-worker

      - name: Verify sensor scenarios, reports, checkpoints and metrics in containers
        run: python drift-worker/tests/integration/run_docker_demo.py

  simulator-ui-ci:
    name: Simulator UI
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sensor-simulator-UI
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sensor-simulator-UI/package-lock.json

      - name: Set up Python for Sensor provider browser integration
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sensor/requirements.lock

      - name: Install locked Sensor provider
        run: |
          python -m pip install -r ../sensor/requirements.lock
          python -m pip install --no-deps -e ../sensor

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck, format and contract/recovery tests
        run: |
          npm run check
          npm test

      - name: Build independent Simulator frontend
        run: npm run build

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser interactions, failure semantics and real Sensor provider
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/simulator-ui-junit.xml
        run: npm run test:e2e -- --reporter=line,junit

      - name: Retain browser results and failure traces
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-ui-browser-results
          path: |
            ${{ runner.temp }}/simulator-ui-junit.xml
            sensor-simulator-UI/test-results/
          if-no-files-found: ignore
          retention-days: 7

  simulator-ui-container:
    name: Simulator UI container
    needs: simulator-ui-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build independent frontend with pinned CI base images
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          images = json.loads(Path("sensor-simulator-UI/ci-images.json").read_text())
          subprocess.run([
              "docker", "build", "--build-arg", "NODE_IMAGE=" + images["node_image"],
              "--build-arg", "NGINX_IMAGE=" + images["nginx_image"],
              "--tag", "maintai-simulator-ui:ci", "sensor-simulator-UI",
          ], check=True)
          PY

      - name: Verify static image, config, probes and API boundary
        run: python3 .github/scripts/container_smoke.py ui --image maintai-simulator-ui:ci
  ingestion-ci:
    name: Ingestion API unit and HTTP contracts
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build internal SDK and install locked app dependencies
        run: |
          python -m pip install build==1.6.1 setuptools==84.0.0 wheel==0.48.0
          python -m build messaging --wheel --outdir /tmp/m1-wheels
          python -m pip install --no-deps /tmp/m1-wheels/maintai_messaging-0.2.0-py3-none-any.whl
          python -m pip install --find-links /tmp/m1-wheels -r ingestion-api/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e ./ingestion-api
      - name: Lint, unit, contract and installed artifacts
        run: |
          ruff check ingestion-api
          ruff format --check ingestion-api
          python -m pytest ingestion-api/tests/unit ingestion-api/tests/contract
          python -m pip check
          python -m build ingestion-api --wheel --outdir /tmp/m1-wheels
          python messaging/scripts/lock_contracts.py --check

  ingestion-integration:
    name: Ingestion real Kafka and container
    needs: ingestion-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAINTAI_INGESTION_INTEGRATION: '1'
      MAINTAI_INGESTION_CONTAINER_TEST: '1'
      KAFKA_TEST_BOOTSTRAP_SERVERS: 127.0.0.1:19092
      MAINTAI_INGESTION_IMAGE: maintai-ingestion:m1-local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install internal SDK and app test dependencies
        run: |
          python -m pip install build==1.6.1 setuptools==84.0.0 wheel==0.48.0
          python -m build messaging --wheel --outdir /tmp/m1-wheels
          python -m pip install --no-deps /tmp/m1-wheels/maintai_messaging-0.2.0-py3-none-any.whl
          python -m pip install --find-links /tmp/m1-wheels -r ingestion-api/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e ./ingestion-api
      - name: Start isolated broker
        run: docker compose -p maintai-m1 -f messaging/tests/integration/compose.yaml up -d --wait kafka
      - name: Verify real broker ACK and quarantine
        run: python -m pytest ingestion-api/tests/integration/test_http_kafka.py
      - name: Build installed runtime image and verify fixture OIDC with Kafka
        run: |
          docker build -f ingestion-api/Dockerfile -t maintai-ingestion:m1-local .
          python -m pytest ingestion-api/tests/integration/test_container.py
      - name: Stop CI broker (retain no application state)
        if: ${{ always() }}
        run: docker compose -p maintai-m1 -f messaging/tests/integration/compose.yaml down

  storage-ci:
    name: Storage Consumer (Python ${{ matrix.python }})
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: storage-consumer/requirements-dev.lock

      - name: Install locked dependencies and local packages
        run: |
          python -m pip install -r storage-consumer/requirements-dev.lock setuptools==84.0.0 wheel==0.48.0
          python -m pip install --no-deps --no-build-isolation -e ./messaging -e ./storage-consumer

      - name: Lint and format
        run: |
          ruff check storage-consumer
          ruff format --check storage-consumer

      - name: Archive, retry, replay, health and credential-isolation tests without AWS
        run: python -m pytest storage-consumer/tests

      - name: Build SDK and Storage distributions
        run: |
          python -m build --no-isolation messaging
          python -m build --no-isolation storage-consumer

      - name: Verify wheel and bundled contracts outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/storage-wheel"
          "$RUNNER_TEMP/storage-wheel/bin/python" -m pip install -r storage-consumer/requirements.lock
          "$RUNNER_TEMP/storage-wheel/bin/python" -m pip install --no-deps messaging/dist/*.whl storage-consumer/dist/*.whl
          cd "$RUNNER_TEMP"
          KAFKA_LOCAL_MODE=true KAFKA_SECURITY_PROTOCOL=PLAINTEXT S3_RAW_BUCKET=fixture-bucket \
            "$RUNNER_TEMP/storage-wheel/bin/maintai-storage" verify-config

  storage-container:
    name: Storage Consumer container
    needs: storage-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build independent Storage image
        run: docker build --file storage-consumer/Dockerfile --tag maintai-storage:ci .

      - name: Verify non-root image and bundled contracts with networking disabled
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' maintai-storage:ci)" = '10001:10001'
          docker run --rm --network none --read-only --tmpfs /tmp \
            -e KAFKA_LOCAL_MODE=true -e KAFKA_SECURITY_PROTOCOL=PLAINTEXT \
            -e S3_RAW_BUCKET=fixture-bucket maintai-storage:ci verify-config

  mlflow-source-ci:
    name: MLflow image source and release handoff
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/mlflow/requirements-dev.lock
      - name: Install release test dependencies, without MLflow server or cloud clients
        run: python -m pip install -r ml-service/mlflow/requirements-dev.lock
      - name: Check image source, contracts and release failure paths offline
        run: |
          ruff check ml-service/mlflow
          ruff format --check ml-service/mlflow
          python ml-service/mlflow/release.py check-source
          python -m pytest ml-service/mlflow/tests

  component-ci:
    name: Component CI (${{ matrix.component }})
    needs: structure
    # TODO: Add real CI steps, then set repository variable ENABLE_COMPONENT_CI=true.
    if: ${{ vars.ENABLE_COMPONENT_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component:
          - ingestion-api
          - processing
          - backend
          - frontend
          - ml-service
          - rag-service
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # TODO: Set up the runtime and cache after the component stack is chosen.
      # TODO: Install dependencies using the component's lockfile.
      # TODO: Run lint.
      # TODO: Run tests.
      # TODO: Build and upload artifacts if this component needs them.
      - name: Component CI not configured
        run: |
          printf '%s\n' 'Replace this placeholder with real CI steps before enabling this job.'
          exit 1

  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - structure
      - api-contracts
      - repo-metadata
      - kafka-ci
      - kafka-integration
      - sensor-ci
      - sensor-container
      - drift-ci
      - drift-container
      - simulator-ui-ci
      - simulator-ui-container
      - storage-ci
      - storage-container
      - mlflow-source-ci
      - component-ci
      - ingestion-ci
      - ingestion-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all enabled CI jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          COMPONENT_CI_ENABLED: ${{ vars.ENABLE_COMPONENT_CI }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          failures = []
          for job, info in sorted(json.loads(os.environ["NEEDS_JSON"]).items()):
              result = info["result"]
              print(f"{job}: {result}")
              disabled_placeholder = (
                  job == "component-ci"
                  and os.environ["COMPONENT_CI_ENABLED"] != "true"
                  and result == "skipped"
              )
              if result != "success" and not disabled_placeholder:
                  failures.append(job)
          if failures:
              print("CI did not succeed: " + ", ".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
