name: RAG checks

on:
  pull_request:
    paths:
      - "rag-service/**"
      - ".github/workflows/rag-ci.yml"
  push:
    paths:
      - "rag-service/**"
      - ".github/workflows/rag-ci.yml"

jobs:
  unit-and-http:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            rag-service/requirements-runtime.lock
            rag-service/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r rag-service/requirements-runtime.lock
          python -m pip install -r rag-service/requirements-test.txt

      - name: Unit and HTTP contract tests
        working-directory: rag-service
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: qwen2.5:3b
          OLLAMA_TIMEOUT: "120"
          EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        run: python -m pytest -q tests

  image-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build RAG image
        run: docker build -f rag-service/Dockerfile -t maintai-rag:ci .

      - name: Container HTTP smoke test
        run: |
          docker run -d --name rag-smoke -p 8002:8002 \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            -e OLLAMA_BASE_URL=http://host.docker.internal:11434 \
            -e OLLAMA_MODEL=qwen2.5:3b \
            -e OLLAMA_TIMEOUT=120 \
            -e EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
            maintai-rag:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8002/health/live \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="UP" and d["service"]=="rag-service"'; then
              echo "RAG HTTP smoke test passed"
              exit 0
            fi
            sleep 2
          done

          docker logs rag-smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f rag-smoke || true
