name: Promote Shadow ML Model to Champion

on:
  workflow_dispatch:
    inputs:
      gitops_repo:
        description: 'Target GitOps repository (owner/name)'
        required: true
        default: 'chiendz11/MaintAI-gitops'
      gitops_branch:
        description: 'Base branch in target GitOps repository'
        required: true
        default: 'main'
      decommission_shadow:
        description: 'Disable ml-service-shadow, mirror proxy, and shadow HPA after promotion'
        required: true
        type: boolean
        default: true
      dry_run:
        description: 'Preview promotion diff without opening a PR'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  promote-shadow:
    name: Open Champion Promotion PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/automation/requirements.lock

      - name: Install automation package
        run: |
          python -m pip install -r ml-service/automation/requirements.lock
          python -m pip install --no-deps -e ./ml-service/automation

      - name: Run promote_shadow_pr.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          FLAGS=""
          if [ "${{ inputs.decommission_shadow }}" = "true" ]; then
            FLAGS="$FLAGS --decommission-shadow"
          else
            FLAGS="$FLAGS --no-decommission-shadow"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python ml-service/automation/promote_shadow_pr.py \
            --gitops-repo "${{ inputs.gitops_repo }}" \
            --base-branch "${{ inputs.gitops_branch }}" \
            $FLAGS
