worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $uri $cache_policy {
    default "no-cache";
    /runtime-config.json "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $cache_policy always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health/live { access_log off; return 200 'ok'; }
    location = /health/ready { access_log off; return 200 'ok'; }
    location = /runtime-config.json { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    # Shared ingress routes /api to Business, never to the static SPA.
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
