hpa:
- name: business-api-hpa
  target: business-api
  min: 1
  max: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
- name: frontend-hpa
  target: frontend
  min: 1
  max: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
- name: ingestion-api-hpa
  target: ingestion-api
  min: 2
  max: 2
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
- name: ml-service-hpa
  target: ml-service
  min: 2
  max: 2
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
- name: ml-service-shadow-hpa
  target: ml-service-shadow
  min: 1
  max: 1
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
- name: rag-service-hpa
  target: rag-service
  min: 1
  max: 3
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 75
        type: Utilization
    type: Resource
keda:
- name: business-consumer-scaledobject
  target: business-consumer
  min: 4
  max: 4
  triggers:
  - metadata:
      allowIdleConsumers: 'false'
      bootstrapServers: kafka.maintai-local.svc.cluster.local:9092
      consumerGroup: local-business-live-v1
      lagThreshold: '20'
      offsetResetPolicy: latest
      topic: sensor.readings
    type: kafka
  - metadata:
      allowIdleConsumers: 'false'
      bootstrapServers: kafka.maintai-local.svc.cluster.local:9092
      consumerGroup: local-business-prediction-v1
      lagThreshold: '20'
      offsetResetPolicy: latest
      topic: inference.results
    type: kafka
  - metadata:
      value: '70'
    metricType: Utilization
    type: cpu
- name: processing-worker-scaledobject
  target: processing-worker
  min: 6
  max: 6
  triggers:
  - metadata:
      allowIdleConsumers: 'false'
      bootstrapServers: kafka.maintai-local.svc.cluster.local:9092
      consumerGroup: local-processing-v1
      lagThreshold: '20'
      offsetResetPolicy: latest
      topic: sensor.readings
    type: kafka
  - metadata:
      value: '70'
    metricType: Utilization
    type: cpu
