      \  keepalive 64;\n  keepalive_requests 50;\n}\n\nupstream shadow_backend {\n\
      \  server ml-service-shadow.maintai-local.svc.cluster.local:8001;\n  keepalive\
      \ 32;\n  keepalive_requests 25;\n}\n\nserver {\n  listen 8001;\n\n  location\
      \ = /health/live {\n    access_log off;\n    return 200 \"ok\\n\";\n  }\n\n\
      \  location = /health/ready {\n    access_log off;\n    return 200 \"ok\\n\"\
      ;\n  }\n\n  location / {\n    mirror /_shadow;\n    mirror_request_body on;\n\
      \    proxy_pass http://champion_backend;\n    proxy_http_version 1.1;\n    proxy_set_header\
      \ Connection \"\";\n    proxy_set_header Host $host;\n    proxy_connect_timeout\
      \ 2s;\n    proxy_read_timeout 5s;\n  }\n\n  location = /_shadow {\n    internal;\n\
      \    if ($shadow_sample = 0) {\n      return 204;\n    }\n    proxy_pass http://shadow_backend$request_uri;\n\
      \    proxy_http_version 1.1;\n    proxy_set_header Connection \"\";\n    proxy_set_header\
      \ Host $host;\n    proxy_pass_request_body on;\n    proxy_ignore_client_abort\
